<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guerrero — Distribuídas x Faturadas</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
    --ok: #22c55e;
    --err: #ef4444;
    --warn: #eab308;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  a.voltar { color: var(--accent); font-size: 13px; text-decoration: none; }
  a.voltar:hover { text-decoration: underline; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .seletor-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  select, input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 8px;
    outline: none;
  }
  select:focus, input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"] {
    flex: 1;
    min-width: 220px;
  }

  .resumo-dia {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .resumo-dia .item { color: var(--muted); }
  .resumo-dia .num { color: var(--text); font-weight: 700; }
  .resumo-dia .num.ok { color: #4ade80; }
  .resumo-dia .num.pend { color: #f87171; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  th, td {
    text-align: left;
    padding: 8px 8px;
    border-bottom: 1px solid var(--border);
    overflow-wrap: break-word;
    vertical-align: top;
  }
  th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  .selo {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .selo.faturado { background: rgba(34,197,94,0.18); color: #4ade80; }
  .selo.pendente { background: rgba(239,68,68,0.18); color: #f87171; }
  .selo.vencido { background: rgba(239,68,68,0.18); color: #f87171; }
  .selo.disponivel { background: rgba(34,197,94,0.18); color: #4ade80; }
  .selo.devolvida { background: rgba(234,179,8,0.18); color: #facc15; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .chassi-cel { color: var(--accent); font-weight: 600; font-size: 11px; word-break: break-all; }
  tr.linha-vencido td { background: rgba(239, 68, 68, 0.06); }
  tr.linha-disponivel td { background: rgba(34, 197, 94, 0.06); }
  tr.linha-devolvida td { background: rgba(234, 179, 8, 0.06); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header-row">
      <div>
        <h1>Guerrero — Distribuídas x Faturadas</h1>
        <div class="sub">Escolha um dia de distribuição para ver o que já foi faturado e o que ainda falta.</div>
      </div>
      <a class="voltar" href="/">← Voltar à busca</a>
    </div>

    <div class="seletor-row">
      <select id="seletorDia"><option value="">Carregando dias...</option></select>
      <input type="text" id="filtroTexto" placeholder="Filtrar por modelo ou chassi..." />
    </div>

    <div id="resumoDiaWrap"></div>
    <div id="tabelaWrap"></div>
  </div>

<script>
const seletorDia = document.getElementById('seletorDia');
const filtroTexto = document.getElementById('filtroTexto');
const resumoDiaWrap = document.getElementById('resumoDiaWrap');
const tabelaWrap = document.getElementById('tabelaWrap');

let itensDoDia = [];

function fmtDiaLabel(iso) {
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}/${ano}`;
}

// Mesma regra da busca principal: devolvida tem prioridade (mesmo dentro do
// prazo, já foi repassada); senão compara VENCE com hoje.
function statusVencimento(venceIso, devolvida) {
  if (devolvida) return 'devolvida';
  if (!venceIso) return null;
  const hoje = new Date();
  const hojeIso = hoje.getFullYear() + '-' +
    String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
    String(hoje.getDate()).padStart(2, '0');
  return venceIso < hojeIso ? 'vencido' : 'disponivel';
}

async function carregarDias() {
  try {
    const resp = await fetch('/api/guerrero-dias');
    const data = await resp.json();
    if (!data.dias || data.dias.length === 0) {
      seletorDia.innerHTML = '<option value="">Nenhum dia disponível</option>';
      return;
    }
    seletorDia.innerHTML = data.dias.map((iso) => `<option value="${iso}">${fmtDiaLabel(iso)}</option>`).join('');
    carregarDia(data.dias[0]);
  } catch (e) {
    seletorDia.innerHTML = '<option value="">Erro ao carregar dias</option>';
  }
}

function itensFiltrados() {
  const termo = filtroTexto.value.trim().toUpperCase();
  if (!termo) return itensDoDia;
  return itensDoDia.filter((item) =>
    (item.moto || '').toUpperCase().includes(termo) ||
    (item.chassi || '').toUpperCase().includes(termo)
  );
}

// Um chassi digitado (parte dele) não tem espaço e costuma ter 4+ caracteres
// alfanuméricos; nome de modelo geralmente tem espaço ou é uma palavra comum.
// Só decide buscar globalmente quando parece mesmo um pedaço de chassi.
function pareceChassi(termo) {
  return /^[A-Z0-9]{4,}$/.test(termo);
}

function tabelaHtml(itens) {
  const rotulosStatus = { vencido: 'Vencido', disponivel: 'Disponível', devolvida: 'Devolvida' };
  return `
    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:9%">
          <col style="width:11%">
          <col style="width:11%">
          <col style="width:12%">
          <col style="width:6%">
          <col style="width:6%">
          <col style="width:8%">
          <col style="width:8%">
          <col style="width:11%">
          <col style="width:12%">
          <col style="width:6%">
        </colgroup>
        <thead>
          <tr>
            <th>Modelo</th>
            <th>Chassi</th>
            <th>Vendedor (distribuição)</th>
            <th>Cliente (distribuição)</th>
            <th>Envio</th>
            <th>Vencimento</th>
            <th>Situação</th>
            <th>Faturamento</th>
            <th>Vendedor (faturamento)</th>
            <th>Cliente (faturamento)</th>
            <th>Data venda</th>
          </tr>
        </thead>
        <tbody>
          ${itens.map((item) => {
            const status = statusVencimento(item.venceIso, item.devolvida);
            const classeLinha = status ? ` linha-${status}` : '';
            const seloStatus = status ? `<span class="selo ${status}">${rotulosStatus[status]}</span>` : '—';
            return `
            <tr class="${classeLinha}">
              <td>${item.moto || '—'}</td>
              <td class="chassi-cel">${item.chassi}</td>
              <td>${item.vendedorDistribuicao || '—'}</td>
              <td>${item.clienteDistribuicao || '—'}</td>
              <td>${item.envio || '—'}</td>
              <td>${item.vence || '—'}</td>
              <td>${seloStatus}</td>
              <td>${item.faturado ? '<span class="selo faturado">Faturado</span>' : '<span class="selo pendente">Não faturado</span>'}</td>
              <td>${item.vendedorFaturamento || '—'}</td>
              <td>${item.clienteFaturamento || '—'}</td>
              <td>${item.dataVenda || '—'}</td>
            </tr>
          `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function renderTabela() {
  const termo = filtroTexto.value.trim().toUpperCase();

  if (termo && pareceChassi(termo)) {
    tabelaWrap.innerHTML = '<div class="empty">Buscando chassi em todos os dias...</div>';
    try {
      const resp = await fetch('/api/guerrero-buscar?q=' + encodeURIComponent(termo));
      const data = await resp.json();
      if (!resp.ok) {
        tabelaWrap.innerHTML = `<div class="empty">${data.erro || 'Erro ao buscar.'}</div>`;
        return;
      }
      if (data.total === 0) {
        tabelaWrap.innerHTML = '<div class="empty">Nenhum chassi encontrado com esse termo, em nenhum dia.</div>';
        return;
      }
      resumoDiaWrap.innerHTML = `
        <div class="resumo-dia">
          <div class="item">Resultado da busca global: <span class="num">${data.total}</span> chassi(s), em qualquer dia</div>
        </div>
      `;
      tabelaWrap.innerHTML = tabelaHtml(data.itens);
    } catch (e) {
      tabelaWrap.innerHTML = `<div class="empty">Erro ao buscar: ${e.message}</div>`;
    }
    return;
  }

  const itens = itensFiltrados();
  if (itensDoDia.length === 0) {
    tabelaWrap.innerHTML = '<div class="empty">Nenhuma distribuição neste dia.</div>';
    return;
  }
  if (itens.length === 0) {
    tabelaWrap.innerHTML = '<div class="empty">Nenhum resultado para esse filtro.</div>';
    return;
  }
  tabelaWrap.innerHTML = tabelaHtml(itens);
}

async function carregarDia(dia) {
  tabelaWrap.innerHTML = '<div class="empty">Carregando...</div>';
  resumoDiaWrap.innerHTML = '';
  itensDoDia = [];
  try {
    const resp = await fetch('/api/guerrero?dia=' + encodeURIComponent(dia));
    const data = await resp.json();
    if (!resp.ok) {
      tabelaWrap.innerHTML = `<div class="empty">${data.erro || 'Erro ao carregar.'}</div>`;
      return;
    }
    itensDoDia = data.itens;

    if (data.total === 0) {
      tabelaWrap.innerHTML = '<div class="empty">Nenhuma distribuição neste dia.</div>';
      return;
    }

    const faturados = data.itens.filter((i) => i.faturado).length;
    const pendentes = data.total - faturados;
    resumoDiaWrap.innerHTML = `
      <div class="resumo-dia">
        <div class="item">Total distribuído: <span class="num">${data.total}</span></div>
        <div class="item">Faturados: <span class="num ok">${faturados}</span></div>
        <div class="item">Não faturados: <span class="num pend">${pendentes}</span></div>
      </div>
    `;

    renderTabela();
  } catch (e) {
    tabelaWrap.innerHTML = `<div class="empty">Erro ao carregar: ${e.message}</div>`;
  }
}

seletorDia.addEventListener('change', () => carregarDia(seletorDia.value));
filtroTexto.addEventListener('input', renderTabela);

carregarDias();
</script>
</body>
</html>
