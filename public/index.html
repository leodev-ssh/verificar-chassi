<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verificador de Chassi</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    align-items: start;
  }
  .layout.com-fila {
    grid-template-columns: minmax(0, 1fr) 320px;
  }
  @media (max-width: 820px) {
    .layout.com-fila {
      grid-template-columns: 1fr;
    }
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .header-row h1,
  .header-row .sub {
    margin-bottom: 0;
  }
  .btn-download {
    display: inline-block;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-download:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 16px;
    font-size: 20px;
    border-radius: 10px;
    letter-spacing: 2px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; margin-bottom: 28px; }
  .msg {
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .msg.err { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .msg.ok { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .card.vencido {
    border-left-color: var(--err);
    background: rgba(239, 68, 68, 0.08);
  }
  .card.no-prazo {
    border-left-color: var(--ok);
    background: rgba(34, 197, 94, 0.08);
  }
  .card .topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .card .chassi {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .selo {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .selo.vencido { background: rgba(239,68,68,0.18); color: #f87171; }
  .selo.no-prazo { background: rgba(34,197,94,0.18); color: #4ade80; }
  .selos {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .selo.tem-fila { background: rgba(59,130,246,0.18); color: #60a5fa; cursor: pointer; }
  .selo.sem-fila { background: rgba(154,161,172,0.15); color: var(--muted); }
  .selo.tem-fila:hover { background: rgba(59,130,246,0.3); }

  .painel-fila {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    position: sticky;
    top: 20px;
  }
  .painel-fila h2 {
    font-size: 14px;
    margin: 0 0 2px;
  }
  .painel-fila .sub-fila {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 14px;
  }
  .fila-item {
    padding: 10px 0;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .fila-item:first-child { border-top: none; }
  .fila-item .linha1 {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .fila-item .pos {
    color: var(--accent);
    font-weight: 700;
  }
  .fila-item .detalhe {
    color: var(--muted);
    font-size: 12px;
  }
  .fila-vazia {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px 20px;
  }
  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .field .val {
    font-size: 14px;
    font-weight: 500;
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer .status { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .upload-form {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .upload-form input[type="file"] {
    color: var(--muted);
    font-size: 12px;
    max-width: 220px;
  }
  .upload-form button {
    padding: 6px 14px;
    font-size: 12px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }

  .resumo-fila {
    margin-bottom: 28px;
  }
  .resumo-fila h2 {
    font-size: 15px;
    margin: 0 0 2px;
  }
  .resumo-fila .sub-fila {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 14px;
  }
  .resumo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .resumo-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .resumo-card .linha1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
  }
  .resumo-card .modelo {
    font-weight: 700;
    font-size: 14px;
  }
  .resumo-card .total {
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
  }
  .resumo-card .cores {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .resumo-card .cor-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px 2px 6px;
    white-space: nowrap;
  }
  .cor-swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header-row">
      <div>
        <h1>Verificador de Chassi</h1>
        <div class="sub">Digite os últimos 4 dígitos do chassi para localizar cliente, supervisor, modelo, cor e vendedor.</div>
      </div>
      <a class="btn-download" href="https://github.com/leodev-ssh/verificar-chassi/releases/download/v1.0.0-desktop/Verificador.de.Chassi.Setup.1.0.0.exe">
        Baixar app para Windows
      </a>
    </div>

    <div class="search-box">
      <input type="text" id="q" placeholder="Ex: 3721" maxlength="17" autofocus />
      <button id="btnBuscar">Buscar</button>
    </div>
    <div class="hint">Aceita de 2 a 17 caracteres (números e letras) — quanto mais dígitos, mais preciso.</div>

    <div id="resumoFilaWrap"></div>

    <div id="msg"></div>
    <div class="layout" id="layout">
      <div id="resultados"></div>
      <div id="painelFilaWrap"></div>
    </div>
  </div>

  <footer>
    <div class="status" id="status">Carregando status...</div>
    <form class="upload-form" id="uploadForm">
      <label>Base de chassis:</label>
      <input type="file" id="arquivo" name="planilha" accept=".xlsx" />
      <button type="submit">Atualizar base</button>
    </form>
    <form class="upload-form" id="uploadFormFila">
      <label>Fila de espera:</label>
      <input type="file" id="arquivoFila" name="planilha" accept=".xlsx" />
      <button type="submit">Atualizar fila</button>
    </form>
  </footer>

<script>
const q = document.getElementById('q');
const btnBuscar = document.getElementById('btnBuscar');
const msgEl = document.getElementById('msg');
const resultadosEl = document.getElementById('resultados');
const painelFilaWrap = document.getElementById('painelFilaWrap');
const resumoFilaWrap = document.getElementById('resumoFilaWrap');
const layoutEl = document.getElementById('layout');
const statusEl = document.getElementById('status');

// Mapa de nome de cor (como vem na planilha) para o tom visual real
const CORES_HEX = {
  'AZUL': '#3b82f6',
  'AZUL METALICO': '#3b5f8f',
  'AZUL MET': '#3b5f8f',
  'BEGE': '#d9c7a3',
  'BRANCA': '#f5f5f5',
  'BRANCA PER': '#f5f5f5',
  'BRANCA PER.': '#f5f5f5',
  'CINZA': '#9ca3af',
  'CINZA MET': '#7c828c',
  'CINZA MET.': '#7c828c',
  'DOURADA': '#d4af37',
  'LARANJA': '#f97316',
  'PRATA': '#c7cad1',
  'PRATA MET': '#c7cad1',
  'PRETA': '#1f2229',
  'PRETA MET.': '#1f2229',
  'PRETA PER': '#1f2229',
  'VERDE': '#22c55e',
  'VERMELHA': '#dc2626',
  'VERM.MET': '#b91c1c',
  'VERM.PER': '#b91c1c',
};
const COR_PADRAO = '#6b7280'; // usado para "QLQ COR", "QUALQUER COR" e cores desconhecidas

function corSwatchHtml(nomeCor) {
  const hex = CORES_HEX[nomeCor.toUpperCase()] || COR_PADRAO;
  return `<span class="cor-swatch" style="background:${hex}"></span>`;
}

function resumoCardHtml(item) {
  const coresHtml = item.cores
    .map((c) => `<span class="cor-tag">${corSwatchHtml(c.cor)}${c.cor}: ${c.quantidade}</span>`)
    .join('');
  return `
    <div class="resumo-card">
      <div class="linha1">
        <span class="modelo">${item.modelo}</span>
        <span class="total">${item.total}</span>
      </div>
      <div class="cores">${coresHtml}</div>
    </div>
  `;
}

async function carregarResumoFila() {
  try {
    const resp = await fetch('/api/fila-resumo');
    const data = await resp.json();
    if (!resp.ok || data.total === 0) {
      resumoFilaWrap.innerHTML = '';
      return;
    }
    resumoFilaWrap.innerHTML = `
      <div class="resumo-fila">
        <h2>Fila de espera por modelo</h2>
        <div class="sub-fila">${data.total} clientes aguardando, em ${data.resumo.length} modelos</div>
        <div class="resumo-grid">${data.resumo.map(resumoCardHtml).join('')}</div>
      </div>
    `;
  } catch (e) {
    resumoFilaWrap.innerHTML = '';
  }
}

function fieldsHtml(r) {
  const fields = [
    ['Modelo', r.moto],
    ['Cor', r.cor],
    ['Supervisor', r.gestor],
    ['Vendedor', r.vendedor],
    ['Cliente', r.cliente],
    ['Modalidade', r.status],
    ['Envio', r.envio],
    ['Vencimento', r.vence],
  ];
  return fields.map(([label, val]) => `
    <div class="field">
      <label>${label}</label>
      <div class="val">${val || '—'}</div>
    </div>
  `).join('');
}

// Compara a data de vencimento (YYYY-MM-DD) com hoje, no fuso local
function statusVencimento(venceIso) {
  if (!venceIso) return null;
  const hoje = new Date();
  const hojeIso = hoje.getFullYear() + '-' +
    String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
    String(hoje.getDate()).padStart(2, '0');
  return venceIso < hojeIso ? 'vencido' : 'no-prazo';
}

function filaItemHtml(f) {
  return `
    <div class="fila-item">
      <div class="linha1">
        <span><span class="pos">${f.posicao}º</span> ${f.cliente || '—'}</span>
      </div>
      <div class="detalhe">${f.vendedor || '—'} · ${f.inclusao || '—'}</div>
    </div>
  `;
}

async function mostrarFilaModelo(moto) {
  layoutEl.classList.add('com-fila');
  painelFilaWrap.innerHTML = `<div class="painel-fila"><div class="fila-vazia">Carregando fila de ${moto}...</div></div>`;
  try {
    const resp = await fetch('/api/fila-modelo?moto=' + encodeURIComponent(moto));
    const data = await resp.json();
    if (!resp.ok || data.total === 0) {
      painelFilaWrap.innerHTML = `
        <div class="painel-fila">
          <h2>Fila de espera</h2>
          <div class="sub-fila">${moto}</div>
          <div class="fila-vazia">Nenhum cliente na fila para este modelo.</div>
        </div>`;
      return;
    }
    painelFilaWrap.innerHTML = `
      <div class="painel-fila">
        <h2>Fila de espera</h2>
        <div class="sub-fila">${moto} — ${data.total} cliente${data.total > 1 ? 's' : ''} aguardando</div>
        ${data.fila.map(filaItemHtml).join('')}
      </div>`;
  } catch (e) {
    painelFilaWrap.innerHTML = `<div class="painel-fila"><div class="fila-vazia">Erro ao carregar fila.</div></div>`;
  }
}

async function buscar() {
  const termo = q.value.trim();
  msgEl.innerHTML = '';
  resultadosEl.innerHTML = '';
  painelFilaWrap.innerHTML = '';
  layoutEl.classList.remove('com-fila');
  if (!termo) {
    resumoFilaWrap.style.display = '';
    return;
  }
  resumoFilaWrap.style.display = 'none';

  btnBuscar.disabled = true;
  try {
    const resp = await fetch('/api/buscar?q=' + encodeURIComponent(termo));
    const data = await resp.json();
    if (!resp.ok) {
      msgEl.innerHTML = `<div class="msg err">${data.erro}</div>`;
      return;
    }
    if (data.total === 0) {
      resultadosEl.innerHTML = '<div class="empty">Nenhum chassi encontrado.</div>';
      return;
    }
    resultadosEl.innerHTML = data.resultados.map(r => {
      const status = statusVencimento(r.venceIso);
      const classeCard = status ? ` ${status}` : '';
      const seloVenc = status
        ? `<span class="selo ${status}">${status === 'vencido' ? 'Vencido' : 'No prazo'}</span>`
        : '';
      const seloFila = r.temFila
        ? `<span class="selo tem-fila" data-moto="${r.moto}">Tem fila (${r.totalFila})</span>`
        : `<span class="selo sem-fila">Sem fila</span>`;
      return `
      <div class="card${classeCard}">
        <div class="topo">
          <div class="chassi">${r.chassi}</div>
          <div class="selos">${seloVenc}${seloFila}</div>
        </div>
        <div class="grid">${fieldsHtml(r)}</div>
      </div>
    `;
    }).join('');

    resultadosEl.querySelectorAll('.selo.tem-fila').forEach((el) => {
      el.addEventListener('click', () => mostrarFilaModelo(el.dataset.moto));
    });

    // Mostra automaticamente a fila do primeiro resultado com fila
    const primeiroComFila = data.resultados.find((r) => r.temFila);
    if (primeiroComFila) {
      mostrarFilaModelo(primeiroComFila.moto);
    }
  } catch (e) {
    msgEl.innerHTML = `<div class="msg err">Erro ao buscar: ${e.message}</div>`;
  } finally {
    btnBuscar.disabled = false;
  }
}

btnBuscar.addEventListener('click', buscar);
q.addEventListener('keydown', (e) => { if (e.key === 'Enter') buscar(); });

async function atualizarStatus() {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    const data_fmt = data.ultimaAtualizacao
      ? new Date(data.ultimaAtualizacao).toLocaleString('pt-BR')
      : 'nunca';
    const filaData_fmt = data.filaEsperaAtualizadaEm
      ? new Date(data.filaEsperaAtualizadaEm).toLocaleString('pt-BR')
      : 'nunca';
    statusEl.innerHTML =
      `<span>${data.totalChassis} chassis na base (${data_fmt})</span>` +
      `<span>${data.totalFilaEspera || 0} na fila de espera (${filaData_fmt})</span>` +
      (data.ultimoErro ? `<span style="color:#f87171">Erro base: ${data.ultimoErro}</span>` : '') +
      (data.filaEsperaErro ? `<span style="color:#f87171">Erro fila: ${data.filaEsperaErro}</span>` : '');
  } catch (e) {
    statusEl.textContent = 'Não foi possível obter status.';
  }
}

document.getElementById('uploadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const arquivo = document.getElementById('arquivo').files[0];
  if (!arquivo) return;
  const formData = new FormData();
  formData.append('planilha', arquivo);
  msgEl.innerHTML = '<div class="msg ok">Enviando e processando planilha...</div>';
  try {
    const resp = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!resp.ok) {
      msgEl.innerHTML = `<div class="msg err">${data.erro}</div>`;
      return;
    }
    msgEl.innerHTML = `<div class="msg ok">Base atualizada: ${data.totalChassis} chassis carregados.</div>`;
    atualizarStatus();
  } catch (e) {
    msgEl.innerHTML = `<div class="msg err">Erro ao enviar: ${e.message}</div>`;
  }
});

document.getElementById('uploadFormFila').addEventListener('submit', async (e) => {
  e.preventDefault();
  const arquivo = document.getElementById('arquivoFila').files[0];
  if (!arquivo) return;
  const formData = new FormData();
  formData.append('planilha', arquivo);
  msgEl.innerHTML = '<div class="msg ok">Enviando e processando fila de espera...</div>';
  try {
    const resp = await fetch('/api/upload-fila', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!resp.ok) {
      msgEl.innerHTML = `<div class="msg err">${data.erro}</div>`;
      return;
    }
    msgEl.innerHTML = `<div class="msg ok">Fila de espera atualizada: ${data.totalFilaEspera} registros carregados.</div>`;
    atualizarStatus();
    carregarResumoFila();
  } catch (e) {
    msgEl.innerHTML = `<div class="msg err">Erro ao enviar: ${e.message}</div>`;
  }
});

atualizarStatus();
carregarResumoFila();
</script>
</body>
</html>
